services:
  openpers:
    # Prebuilt release image (set OPENPERS_IMAGE in .env, e.g. ghcr.io/<owner>/openpers:0.2),
    # or build locally from this checkout with `docker compose up -d --build`.
    image: ${OPENPERS_IMAGE:-openpers:local}
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://openpers:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/openpers
      DATA_DIR: /data
    volumes:
      - openpers-files:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpers
      POSTGRES_DB: openpers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - openpers-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpers -d openpers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openpers-db:
  openpers-files:
